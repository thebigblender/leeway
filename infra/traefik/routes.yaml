http:
  routers:
    demo:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - web
      service: rollout

  services:
    rollout:
      weighted:
        services:
          - name: stable
            weight: 0
          - name: candidate
            weight: 100
    stable:
      loadBalancer:
        servers:
          - url: http://stable:8000
    candidate:
      loadBalancer:
        servers:
          - url: http://candidate:8000
